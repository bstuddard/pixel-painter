[package]
name = "painter"
version = "0.1.0"
edition = "2024"
description = "A CLI pixel painter with persistent RGBA canvases and terminal previews"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
