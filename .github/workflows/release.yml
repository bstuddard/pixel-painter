name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (leave blank for a trial build)
        required: false
        type: string
      publish:
        description: Publish the checked tag as a public stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate immutable release candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          REQUEST_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: python tools/release.py prepare --tag "$RELEASE_TAG" --publish "$REQUEST_PUBLISH" --github-output "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      revision: ${{ needs.prepare.outputs.commit }}

  source:
    needs: [prepare, checks]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Package source and dependency notices
        run: python tools/release.py source --output dist --notices "$RUNNER_TEMP/core-notices"
      - name: Test extracted source offline with an empty Cargo cache
        run: python tools/release.py verify "dist/painter-$VERSION-source.tar.gz" --offline-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-source
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-notices
          path: ${{ runner.temp }}/core-notices/
          if-no-files-found: error

  build:
    needs: [prepare, checks, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: painter
            archive: tar.gz
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: painter.exe
            archive: zip
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            binary: painter
            archive: tar.gz
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: painter
            archive: tar.gz
            rustflags: ''
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      ARCHIVE: ${{ matrix.archive }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-notices
          path: ${{ runner.temp }}/core-notices
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Test and build
        run: |
          cargo +stable test --manifest-path rust/Cargo.toml --release --locked --target "$TARGET"
          cargo +stable build --manifest-path rust/Cargo.toml --release --locked --target "$TARGET"
      - name: Prepare native download
        run: python tools/release.py binary --binary "rust/target/$TARGET/release/$BINARY" --platform "$PLATFORM" --notices "$RUNNER_TEMP/core-notices" --output dist
      - name: Test executable and documentation from the extracted archive
        run: python tools/release.py verify "dist/painter-$VERSION-$PLATFORM.$ARCHIVE" --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  assemble:
    needs: [prepare, checks, source, build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Validate complete download set and create checksums
        run: python tools/release.py checksums --directory dist --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-downloads
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.prepare.outputs.tag != ''
    needs: [prepare, checks, source, build, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-downloads
          path: dist
      - name: Publish explicitly requested stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file CHANGELOG.md --draft=false --prerelease=false --latest
